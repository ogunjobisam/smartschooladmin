<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSchoolAdmin — School Management Software</title>
    <meta name="description" content="School finance and operations software for private schools and school groups — fees, invoicing, payments, payroll, attendance and reporting in one place." />
    <meta name="author" content="SmartSchoolAdmin" />
    <meta name="theme-color" content="#0F766E" />

    <!-- Set the mode before the bundle loads, or the first frame is light and
         the app visibly flips. Reads the same "theme" key next-themes writes;
         see THEME_STORAGE_KEY in src/hooks/use-theme-mode.ts. -->
    <script>
      try {
        var stored = localStorage.getItem("theme");
        var dark = stored === "dark" ||
          ((!stored || stored === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {
        /* Private mode, or storage blocked: the light default is correct. */
      }
    </script>
